name: Finalize PWA assets and validate
on:
  push:
    branches: [feat/pwa-install-and-safe-updates]
    paths-ignore:
      - package-lock.json
      - public/pwa-192.png
      - public/pwa-512.png
      - public/apple-touch-icon.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Resolve and lock dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate PNG app icons
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          source = Path('public/icon.svg').read_bytes()
          for size, name in [(192, 'pwa-192.png'), (512, 'pwa-512.png'), (180, 'apple-touch-icon.png')]:
              cairosvg.svg2png(bytestring=source, write_to='public/' + name, output_width=size, output_height=size)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit generated lockfile and icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/pwa-192.png public/pwa-512.png public/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(pwa): lock dependencies and generate install icons"
            git push
          fi
