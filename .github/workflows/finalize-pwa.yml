name: Finalize PWA assets and validate
on:
  push:
    branches: [feat/pwa-install-and-safe-updates]
    paths-ignore:
      - pnpm-lock.yaml
      - public/pwa-192.png
      - public/pwa-512.png
      - public/apple-touch-icon.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate PNG app icons
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          source = Path('public/icon.svg').read_bytes()
          for size, name in [(192, 'pwa-192.png'), (512, 'pwa-512.png'), (180, 'apple-touch-icon.png')]:
              cairosvg.svg2png(bytestring=source, write_to='public/' + name, output_width=size, output_height=size)
          PY
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pwa-192.png public/pwa-512.png public/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(pwa): generate install icons"
            git push
          fi
