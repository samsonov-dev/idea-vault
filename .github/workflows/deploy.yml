name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      access_ready:
        description: "I configured Cloudflare Access for this hostname and verified the owner-only policy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: idea-vault-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.access_ready == true
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_TEAM_DOMAIN: https://ancient-art-7e0e.cloudflareaccess.com
      CF_ACCESS_AUD: e050fa4ccaaddc76164c7cb20788e2d3b735bb61b0cd47d5c91019b434a17576
      OWNER_EMAIL: ssamsonov1998@gmail.com
      CF_ACCESS_SERVICE_TOKEN_ID: ${{ vars.CF_ACCESS_SERVICE_TOKEN_ID }}
      HOSTNAME: idea.samsonov-dev.com
      DATABASE_ID: d3815929-7d2d-499d-8637-92dfda9bd1d1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_ACCESS_TEAM_DOMAIN"
          test -n "$CF_ACCESS_AUD"
          test -n "$OWNER_EMAIL"
          [[ "$HOSTNAME" =~ ^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$ ]]
          [[ "$DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$CF_ACCESS_TEAM_DOMAIN" =~ ^https://[a-zA-Z0-9-]+\.cloudflareaccess\.com/?$ ]]
      - name: Install and validate
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm run test:browser
      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests-deploy
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure production bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases[0].database_id = process.env.DATABASE_ID;
          config.routes = [{ pattern: process.env.HOSTNAME, custom_domain: true }];
          config.vars = {
            CF_ACCESS_TEAM_DOMAIN: process.env.CF_ACCESS_TEAM_DOMAIN,
            CF_ACCESS_AUD: process.env.CF_ACCESS_AUD,
            OWNER_EMAIL: process.env.OWNER_EMAIL,
            ...(process.env.CF_ACCESS_SERVICE_TOKEN_ID ? { CF_ACCESS_SERVICE_TOKEN_ID: process.env.CF_ACCESS_SERVICE_TOKEN_ID } : {}),
          };
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply idea-vault --remote
      - name: Deploy
        run: pnpm exec wrangler deploy
